<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIコーチ付きナンプレ</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background-color: #fdf6e3; color: #4a4a4a; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; margin: 0; padding-top: 15px; touch-action: manipulation; position: relative; }
        #menu-screen, #game-screen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; position: relative; }
        h1 { color: #d35400; font-size: 2rem; margin-bottom: 10px; text-align: center; text-shadow: 2px 2px 0px #f39c12; letter-spacing: 2px; }
        
        .ticket-info-area { background-color: #fff; border: 3px solid #f1c40f; border-radius: 10px; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; width: 90%; margin-bottom: 20px; box-shadow: 0 4px 0px rgba(0,0,0,0.05); box-sizing: border-box; }
        .ticket-count { font-size: 1.1rem; font-weight: bold; color: #333; }
        .ticket-buy-btn { background-color: #f1c40f; color: #d35400; border: none; padding: 8px 12px; font-weight: bold; border-radius: 20px; cursor: pointer; box-shadow: 0 3px 0px #f39c12; transition: all 0.1s; }
        .ticket-buy-btn:active { transform: translateY(3px); box-shadow: 0 0px 0px #f39c12; }

        .section-title { color: #666; font-size: 1.1rem; margin-bottom: 15px; font-weight: bold; text-align: center; border-bottom: 3px dashed #ccc; padding-bottom: 5px; width: 80%; }

        .coach-selection { display: flex; gap: 15px; margin-bottom: 20px; width: 90%; justify-content: center; }
        .coach-btn { background-color: #fff; border: 4px solid #bdc3c7; border-radius: 12px; padding: 0; overflow: hidden; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 0px #bdc3c7; display: flex; align-items: center; justify-content: center; flex: 1; max-width: 90px; height: 90px; }
        .coach-btn.active { border-color: #e74c3c; background-color: #ffeaea; box-shadow: 0 4px 0px #e74c3c; transform: translateY(-2px); }
        .coach-btn img { width: 100%; height: 100%; image-rendering: pixelated; object-fit: contain; transform: scale(1.5); }
        .coach-label { font-size: 1rem; color: #4a4a4a; text-align: center; font-weight: bold; margin-top: 5px; }

        .tabs { display: flex; width: 95%; justify-content: space-between; margin-bottom: 15px; gap: 5px; }
        .tab-btn { flex: 1; padding: 10px 5px; font-size: 1rem; font-weight: bold; border-radius: 10px 10px 0 0; background-color: #ecf0f1; border: 3px solid #bdc3c7; border-bottom: none; color: #7f8c8d; cursor: pointer; transition: all 0.2s; font-family: 'M PLUS Rounded 1c', sans-serif; }
        .tab-btn.active { background-color: #3498db; color: white; border-color: #2980b9; box-shadow: 0 -3px 0px rgba(0,0,0,0.1) inset; }
        .tab-btn.premium { color: #f39c12; }
        .tab-btn.premium.active { background-color: #2c3e50; color: #f1c40f; border-color: #1a252f; }

        .stage-grid-container { background-color: #3498db; width: 95%; padding: 15px; border-radius: 0 0 12px 12px; border: 4px solid #2980b9; box-shadow: 0 5px 0px #2980b9; box-sizing: border-box; margin-bottom: 20px; max-height: 400px; overflow-y: auto; }
        .stage-grid-container.premium { background-color: #2c3e50; border-color: #1a252f; box-shadow: 0 5px 0px #1a252f; }

        .stage-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .stage-btn { background-color: #fff; color: #2980b9; border: 3px solid #bdc3c7; aspect-ratio: 1; font-size: 1.6rem; font-weight: bold; border-radius: 10px; cursor: pointer; box-shadow: 0 4px 0px #bdc3c7; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'M PLUS Rounded 1c', sans-serif; transition: all 0.1s; position: relative; }
        .stage-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #bdc3c7; }
        .stage-btn.locked { background-color: #e0e0e0; color: #999; border-color: #b0b0b0; box-shadow: 0 4px 0px #b0b0b0; }
        .stage-btn.locked::after { content: '🔒'; position: absolute; font-size: 1.5rem; opacity: 0.8; }
        .stage-btn.locked span { opacity: 0.3; }
        .stage-btn.cleared { background-color: #fef9e7; color: #d35400; border-color: #f1c40f; box-shadow: 0 4px 0px #f39c12; overflow: hidden; }
        .stage-btn.cleared::before { content: '👑'; position: absolute; font-size: 4.5rem; opacity: 0.15; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 0; }
        .stage-btn.cleared span.stage-num { font-size: 1.6rem; z-index: 1; position: relative; margin-top: -2px; }
        .best-time-label { font-size: 0.85rem; color: #e67e22; font-weight: bold; line-height: 1; z-index: 1; position: relative; letter-spacing: 0.5px;}

        .top-info-wrapper { display: flex; flex-direction: column; width: 90%; gap: 15px; margin-bottom: 20px; }
        .header-area { display: flex; justify-content: space-between; align-items: center; background-color: #fff; padding: 10px 15px; border-radius: 10px; border: 3px solid #ccc; box-sizing: border-box; box-shadow: 0 4px 0px rgba(0,0,0,0.05); }
        #stage-title { color: #d35400; font-size: 1.3rem; font-weight: bold; margin: 0; }
        #timer { font-size: 1.4rem; font-weight: bold; color: #34495e; letter-spacing: 2px; }

        .ai-character-area { width: 100%; height: 120px; background-color: #fff; border-radius: 15px; display: flex; align-items: flex-end; justify-content: center; border: 4px solid #7f8c8d; box-shadow: 0 6px 0px #7f8c8d; overflow: hidden; position: relative; box-sizing: border-box; }
        .ai-character-area::before { content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px; border: 2px dashed #d5dbdb; border-radius: 10px; pointer-events: none; }
        .ai-character-area.thinking { background-color: #fff8e1; border-color: #f39c12; box-shadow: 0 6px 0px #f39c12; }
        .ai-character-area.thinking::before { border-color: #fdebd0; }
        .ai-character-area.happy { background-color: #e8f5e9; border-color: #27ae60; box-shadow: 0 6px 0px #27ae60; }
        .ai-character-area.happy::before { border-color: #d5f5e3; }
        #coach-image { max-height: 100%; width: auto; image-rendering: pixelated; object-fit: contain; z-index: 1; }

        .sudoku-container { background-color: #ecf0f1; padding: 8px; border-radius: 12px; box-shadow: 0 6px 0px #bdc3c7; border: 4px solid #7f8c8d; margin-bottom: 25px; }
        table { border-collapse: collapse; border: 4px solid #2c3e50; table-layout: fixed; background-color: #fff; margin: 0 auto; }
        td { border: 1px solid #bdc3c7; width: 42px; height: 42px; text-align: center; vertical-align: middle; font-size: 1.8rem; font-weight: bold; color: #2c3e50; cursor: pointer; padding: 0; user-select: none; line-height: 1; }
        td.fixed { color: #2980b9; background-color: #ebf5fb; cursor: default; }
        td.selected { background-color: #fff3e0; border: 3px solid #e67e22; font-size: 2rem; color: #d35400; z-index: 10; position: relative; }
        td.error { color: #e74c3c; background-color: #fdedec; font-weight: 900; animation: shake 0.3s; }
        @keyframes shake { 0% {transform: translateX(0);} 25% {transform: translateX(-3px);} 50% {transform: translateX(3px);} 75% {transform: translateX(-3px);} 100% {transform: translateX(0);} }
        td.highlight { background-color: #f1c40f !important; border: 3px solid #f39c12 !important; position: relative; z-index: 5; }

        td:nth-child(3n) { border-right: 3px solid #2c3e50; }
        tr:nth-child(3n) td { border-bottom: 3px solid #2c3e50; }
        td:last-child { border-right: 4px solid #2c3e50; }
        tr:last-child td { border-bottom: 4px solid #2c3e50; }
        td:first-child { border-left: 4px solid #2c3e50; }
        tr:first-child td { border-top: 4px solid #2c3e50; }

        .numpad { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; width: 95%; margin-bottom: 20px; }
        .num-btn { background-color: #fdfefe; border: 3px solid #95a5a6; padding: 12px 0; font-size: 1.6rem; font-weight: bold; border-radius: 10px; color: #2c3e50; cursor: pointer; box-shadow: 0 5px 0px #95a5a6; }
        .num-btn:active { transform: translateY(5px); box-shadow: 0 0px 0px #95a5a6; }
        .num-btn.delete-btn { background-color: #e74c3c; color: white; border-color: #c0392b; box-shadow: 0 5px 0px #c0392b; }
        .num-btn.delete-btn:active { box-shadow: 0 0px 0px #c0392b; }

        .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 95%; margin-bottom: 30px; }
        #hint-area { background-color: #fef9e7; border: 4px solid #f1c40f; padding: 15px; border-radius: 12px; width: 100%; box-sizing: border-box; color: #333; font-size: 1.1rem; line-height: 1.5; display: none; font-weight: bold; text-align: center; box-shadow: 0 4px 0px rgba(0,0,0,0.1); }
        #loading { display: none; color: #e67e22; font-weight: bold; font-size: 1.1rem; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        
        #hint-btn { background-color: #f1c40f; color: #d35400; border: 4px solid #f39c12; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; box-shadow: 0 5px 0px #f39c12; width: 100%; }
        #hint-btn:active { transform: translateY(5px); box-shadow: 0 0px 0px #f39c12; }
        #hint-btn:disabled { background-color: #ecf0f1; border-color: #bdc3c7; color: #95a5a6; box-shadow: 0 5px 0px #bdc3c7; cursor: not-allowed; }
        #hint-btn.upsell-mode { background-color: #ff9800; color: white; border-color: #e65100; box-shadow: 0 5px 0px #e65100; text-shadow: 1px 1px 0px #222; }
        
        .back-btn { background-color: #95a5a6; color: white; border: 4px solid #7f8c8d; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 12px; cursor: pointer; width: 80%; box-shadow: 0 4px 0px #7f8c8d; }
        .back-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #7f8c8d; }
        
        /* 引継ぎ用ボタン（右上に配置） */
        .transfer-mini-btn { position: absolute; top: 10px; right: 15px; font-size: 1.2rem; background: #fff; border: 2px solid #ccc; border-radius: 50%; width: 35px; height: 35px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 0px #ccc; }
        .transfer-mini-btn:active { transform: translateY(2px); box-shadow: 0 0px 0px #ccc; }

        #clear-modal, #transfer-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background-color: #fff; padding: 30px; border-radius: 20px; text-align: center; width: 85%; max-width: 320px; border: 6px solid #f1c40f; box-shadow: 0 10px 0px #f39c12; }
        .modal-title { font-size: 2.2rem; color: #e74c3c; margin-top: 0; margin-bottom: 15px; font-weight: bold; text-shadow: 2px 2px 0px #f1c40f; }
        .modal-time { font-size: 1.4rem; color: #2c3e50; margin-bottom: 25px; font-weight: bold; }
        .modal-btn { background-color: #2ecc71; color: white; border: 4px solid #27ae60; padding: 15px 24px; font-size: 1.2rem; font-weight: bold; border-radius: 30px; cursor: pointer; width: 100%; box-shadow: 0 5px 0px #27ae60; }
        .modal-btn:active { transform: translateY(5px); box-shadow: 0 0px 0px #27ae60; }

        @media screen and (max-width: 500px), screen and (max-height: 850px) {
            body { padding-top: 5px; }
            .ticket-info-area { padding: 8px 10px; margin-bottom: 10px; width: 95%; margin-top: 35px; }
            .ticket-count { font-size: 1rem; }
            .ticket-buy-btn { font-size: 0.9rem; padding: 6px 10px; }
            .top-info-wrapper { flex-direction: row; align-items: stretch; margin-bottom: 10px; width: 95%; gap: 10px; }
            .header-area { flex: 1; flex-direction: column; justify-content: center; padding: 6px; border-width: 3px; box-shadow: 0 3px 0px rgba(0,0,0,0.05); }
            #stage-title { font-size: 1rem; margin-bottom: 4px; text-align: center; }
            #timer { font-size: 1.2rem; text-align: center; }
            .ai-character-area { width: 85px; height: 85px; flex-shrink: 0; border-width: 3px; box-shadow: 0 4px 0px #7f8c8d; border-radius: 12px; }
            .ai-character-area::before { top: 3px; left: 3px; right: 3px; bottom: 3px; }
            .sudoku-container { padding: 6px; margin-bottom: 12px; border-width: 3px; box-shadow: 0 4px 0px #bdc3c7; }
            table { border-width: 3px; }
            td { width: 34px; height: 34px; font-size: 1.5rem; }
            td.selected { font-size: 1.6rem; border-width: 2px; }
            .numpad { gap: 6px; margin-bottom: 12px; width: 98%; }
            .num-btn { padding: 6px 0; font-size: 1.4rem; border-width: 2px; box-shadow: 0 4px 0px #95a5a6; border-radius: 8px; }
            .num-btn.delete-btn { font-size: 1.2rem; box-shadow: 0 4px 0px #c0392b; }
            .controls { gap: 10px; margin-bottom: 10px; width: 98%; }
            #hint-btn { padding: 12px; font-size: 1.1rem; border-width: 3px; box-shadow: 0 4px 0px #f39c12; border-radius: 20px; }
            .back-btn { padding: 10px; font-size: 0.9rem; width: 85%; margin-bottom: 0; border-width: 3px; box-shadow: 0 3px 0px #7f8c8d; }
            .tabs { margin-bottom: 10px; }
            .tab-btn { font-size: 0.9rem; padding: 8px 2px; }
            .stage-grid-container { padding: 10px; max-height: 350px; }
            .stage-btn { font-size: 1.4rem; }
            .transfer-mini-btn { top: 5px; right: 10px; width: 30px; height: 30px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div id="menu-screen">
        <button class="transfer-mini-btn" onclick="openTransferModal()" title="データの引継ぎ">⚙️</button>
        
        <h1 style="margin-top: 15px;">AIコーチ付きナンプレ</h1>
        
        <div id="resume-container" style="display:none; width: 90%; margin-bottom: 20px;">
            <button onclick="resumeActiveGame()" style="background-color: #27ae60; color: white; border: 4px solid #2ecc71; padding: 15px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; width: 100%; box-shadow: 0 5px 0px #2ecc71; cursor: pointer; transition: all 0.1s;">▶ プレイ中のデータから再開する</button>
        </div>

        <div class="ticket-info-area">
            <div class="ticket-count">🎟️ ヒントチケット: <span id="ticket-display">0</span>回分</div>
            <button class="ticket-buy-btn" onclick="purchaseHintTicket()">補充する(100円)</button>
        </div>
        
        <div class="section-title">相棒（コーチ）を選んでください</div>
        <div class="coach-selection">
            <div><button class="coach-btn" id="coach-male" onclick="selectCoach('male')"><img src="images/coach_male_normal.png" alt="マコト"></button><div class="coach-label">マコト</div></div>
            <div><button class="coach-btn active" id="coach-robot" onclick="selectCoach('robot')"><img src="images/coach_robot_normal.png" alt="ロボ助"></button><div class="coach-label">ロボ助</div></div>
            <div><button class="coach-btn" id="coach-female" onclick="selectCoach('female')"><img src="images/coach_female_normal.png" alt="サクラ"></button><div class="coach-label">サクラ</div></div>
        </div>

        <div class="section-title">遊ぶステージを選んでください</div>
        <div class="tabs">
            <button class="tab-btn active" onclick="changeTab('beginner')">初級</button>
            <button class="tab-btn" onclick="changeTab('intermediate')">中級</button>
            <button class="tab-btn" onclick="changeTab('advanced')">上級</button>
            <button class="tab-btn premium" onclick="changeTab('master')">達人級👑</button>
        </div>

        <div id="stage-grid-area" class="stage-grid-container">
            <div class="stage-grid" id="stage-grid"></div>
        </div>

        <!-- ★追加部分：法務ページへのリンクをメニュー画面の一番下に配置 -->
        <div style="text-align: center; margin-top: 15px; margin-bottom: 20px;">
            <a href="legal.html" style="font-size: 0.85rem; color: #7f8c8d; text-decoration: underline;">特商法に基づく表記・利用規約</a>
        </div>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="top-info-wrapper">
            <div class="header-area">
                <div id="stage-title"></div>
                <div id="timer">00:00</div>
            </div>
            <div id="ai-character" class="ai-character-area"><img id="coach-image" src="images/coach_robot_normal.png" alt="コーチ"></div>
        </div>

        <div class="sudoku-container"><table id="sudoku-board"></table></div>

        <div class="numpad">
            <button class="num-btn" onclick="inputNumber(1)">1</button><button class="num-btn" onclick="inputNumber(2)">2</button>
            <button class="num-btn" onclick="inputNumber(3)">3</button><button class="num-btn" onclick="inputNumber(4)">4</button>
            <button class="num-btn" onclick="inputNumber(5)">5</button><button class="num-btn" onclick="inputNumber(6)">6</button>
            <button class="num-btn" onclick="inputNumber(7)">7</button><button class="num-btn" onclick="inputNumber(8)">8</button>
            <button class="num-btn" onclick="inputNumber(9)">9</button><button class="num-btn delete-btn" onclick="inputNumber(0)">消</button>
        </div>

        <div class="controls">
            <div id="loading">AIコーチが思考中...（約6秒）</div>
            <div id="hint-area"></div>
            <button id="hint-btn">AIにヒントを聞く</button>
            <button class="back-btn" onclick="backToMenu()">メニューに戻る</button>
        </div>
    </div>

    <div id="clear-modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-title">🎉 クリア！ 🎉</div>
            <div class="modal-time">タイム: <span id="final-time">00:00</span></div>
            <button class="modal-btn" onclick="closeClearModal()">メニューへ戻る</button>
        </div>
    </div>

    <div id="transfer-modal" style="display: none; z-index: 2000;">
        <div style="background-color: #fff; padding: 20px; border-radius: 15px; width: 90%; max-width: 350px; text-align: center; border: 4px solid #3498db; box-shadow: 0 10px 0px rgba(0,0,0,0.2);">
            <h3 style="margin-top: 0; color: #2980b9;">データの引継ぎ</h3>
            <p style="font-size: 0.85rem; color: #666; text-align: left; margin-bottom: 10px;">ブラウザ版からホーム画面版へデータを移す場合、下のコードをコピーして貼り付けてください。</p>
            
            <textarea id="export-code" style="width: 100%; height: 60px; margin-bottom: 5px; font-size: 0.7rem;" readonly></textarea>
            <button onclick="copyTransferCode()" style="background: #3498db; color: #fff; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; width: 100%;">コピーする</button>
            
            <hr style="border: 1px dashed #ccc; margin-bottom: 15px;">
            
            <textarea id="import-code" style="width: 100%; height: 60px; margin-bottom: 5px; font-size: 0.7rem;" placeholder="ここに引継ぎコードを貼り付け"></textarea>
            <button onclick="importTransferCode()" style="background: #e67e22; color: #fff; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 10px;">データを復元する</button>
            
            <button onclick="document.getElementById('transfer-modal').style.display='none'" style="background: #95a5a6; color: #fff; border: none; padding: 8px; border-radius: 5px; cursor: pointer; width: 100%;">閉じる</button>
        </div>
    </div>

    <script src="stages_beginner.js"></script><script src="stages_intermediate.js"></script>
    <script src="stages_advanced.js"></script><script src="stages_master.js"></script>

    <script>
        if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(e => console.log('SW登録スキップ')); }); }

        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz8QSamnvNTVYxntMMXYOSGD5N-8jX7C4btmiliztAartPgbd-IxZnRhmwe3UoRNiTNnw/exec";
        
       // ★本番環境用のリンク
        const STRIPE_LINKS = {
            hint: "https://buy.stripe.com/00wfZj6KO1KXaWWdkRfMA00",
            beginner: "https://buy.stripe.com/4gM5kF0mq3T5ghgeoVfMA01",
            intermediate: "https://buy.stripe.com/6oUcN72uycpBaWWeoVfMA02",
            advanced: "https://buy.stripe.com/bJecN77OS61dd5494BfMA03",
            master: "https://buy.stripe.com/8x2fZjfhk3T55CC94BfMA04"
        };

        const coachImages = {
            male: { normal: 'images/coach_male_normal.png', thinking: 'images/coach_male_thinking.png', happy_a: 'images/coach_male_happy_a.png', happy_b: 'images/coach_male_happy_b.png' },
            female: { normal: 'images/coach_female_normal.png', thinking: 'images/coach_female_thinking.png', happy_a: 'images/coach_female_happy_a.png', happy_b: 'images/coach_female_happy_b.png' },
            robot: { normal: 'images/coach_robot_normal.png', thinking: 'images/coach_robot_thinking.png', happy_a: 'images/coach_robot_happy_a.png', happy_b: 'images/coach_robot_happy_b.png' }
        };
        
        let currentCoach = 'robot', happyAnimationInterval = null, currentDifficulty = 'beginner'; 
        let playSessionId = 0, isThinking = false, freeHintsRemaining = 3; 
        let startTime, timerInterval, isCleared = false, selectedCell = null;
        let currentOriginalBoard = [], currentBoardData = [];
        let elapsedSecondsOffset = 0; 

        let savedData = JSON.parse(localStorage.getItem('sudokuAppSave')) || {
            unlockedPacks: { beginner: 0, intermediate: 0, advanced: 0, master: 0 },
            cleared: {}, bestTimes: {}, hintTickets: 0
        };

        function saveGameData() { localStorage.setItem('sudokuAppSave', JSON.stringify(savedData)); }
        function updateTicketDisplay() { document.getElementById('ticket-display').innerText = savedData.hintTickets || 0; }

        function saveCurrentGame() {
            if (isCleared || !stageTitle.innerText) return;
            const totalSeconds = elapsedSecondsOffset + Math.floor((Date.now() - startTime) / 1000);
            savedData.activeGame = {
                title: stageTitle.innerText, originalBoard: currentOriginalBoard, currentBoard: currentBoardData,
                difficulty: currentDifficulty, elapsedSeconds: totalSeconds, freeHints: freeHintsRemaining
            };
            saveGameData();
        }

        function clearCurrentGame() {
            delete savedData.activeGame;
            saveGameData();
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            let cameFromPayment = false;

            if (urlParams.get('payment_success') === 'true') {
                cameFromPayment = true;
                const pack = urlParams.get('pack');
                if (pack === 'hint') {
                    savedData.hintTickets = (savedData.hintTickets || 0) + 100;
                    alert("決済完了！AIヒントチケット100回分を追加しました🎉");
                } else if (pack === 'beginner') { savedData.unlockedPacks.beginner++; alert("初級パックを解放しました！"); }
                else if (pack === 'intermediate') { savedData.unlockedPacks.intermediate++; alert("中級パックを解放しました！"); }
                else if (pack === 'advanced') { savedData.unlockedPacks.advanced++; alert("上級パックを解放しました！"); }
                else if (pack === 'master') { savedData.unlockedPacks.master++; alert("達人級パックを解放しました！"); }
                saveGameData();
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            updateTicketDisplay();

            if (cameFromPayment && savedData.activeGame) {
                resumeActiveGame();
            } else {
                initMenu();
            }
        };

        const stagesDataMap = {
            'beginner': typeof stagesBeginnerData !== 'undefined' ? stagesBeginnerData : [],
            'intermediate': typeof stagesIntermediateData !== 'undefined' ? stagesIntermediateData : [],
            'advanced': typeof stagesAdvancedData !== 'undefined' ? stagesAdvancedData : [],
            'master': typeof stagesMasterData !== 'undefined' ? stagesMasterData : []
        };
        const testBoard = [[5,3,4,6,7,8,9,1,2], [6,7,2,1,9,5,3,4,8], [1,9,8,3,4,2,5,6,7], [8,5,9,7,6,1,4,2,3], [4,2,6,8,5,3,7,9,1], [7,1,3,9,2,4,8,5,6], [9,6,1,5,3,7,2,8,4], [2,8,7,4,1,9,6,3,5], [3,4,5,2,8,6,1,7,0]];
        const menuScreen = document.getElementById('menu-screen'), gameScreen = document.getElementById('game-screen');
        const table = document.getElementById('sudoku-board'), hintBtn = document.getElementById('hint-btn'), hintArea = document.getElementById('hint-area');
        const loadingDisplay = document.getElementById('loading'), timerDisplay = document.getElementById('timer'), stageTitle = document.getElementById('stage-title');
        const aiCharacterArea = document.getElementById('ai-character'), coachImage = document.getElementById('coach-image'), clearModal = document.getElementById('clear-modal');

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { try { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} }
        function playTone(freq, type, duration, vol=0.1) { try { initAudio(); if(!audioCtx)return; const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain(); osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime); gain.gain.setValueAtTime(vol, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration); osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + duration); } catch(e){} }
        function playClickSound() { playTone(600, 'sine', 0.1, 0.1); }
        function playErrorSound() { playTone(150, 'sawtooth', 0.3, 0.15); }
        function playStartSound() { playTone(400, 'square', 0.1, 0.05); setTimeout(() => playTone(600, 'square', 0.15, 0.05), 100); }
        function playClearSound() { playTone(400, 'square', 0.1, 0.1); setTimeout(() => playTone(400, 'square', 0.1, 0.1), 150); setTimeout(() => playTone(400, 'square', 0.1, 0.1), 300); setTimeout(() => playTone(600, 'square', 0.4, 0.1), 450); }
        function playHintReadySound() { playTone(880, 'sine', 0.1, 0.1); setTimeout(() => playTone(1318, 'sine', 0.2, 0.1), 100); }

        function formatTime(totalSeconds) { const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0'), s = (totalSeconds % 60).toString().padStart(2, '0'); return `${m}:${s}`; }

        function changeTab(difficulty) {
            playClickSound(); currentDifficulty = difficulty;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active')); event.target.classList.add('active');
            const gridContainer = document.getElementById('stage-grid-area');
            difficulty === 'master' ? gridContainer.classList.add('premium') : gridContainer.classList.remove('premium');
            renderStageGrid();
        }

        function renderStageGrid() {
            const grid = document.getElementById('stage-grid'); grid.innerHTML = ""; 
            const currentStageList = stagesDataMap[currentDifficulty];
            const maxStage = currentStageList.length;

            if (maxStage === 0) { grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:#fff;">データがありません。<br>外部ファイルに問題を追加してください！</div>'; return; }

            const diffName = { 'beginner': '初級', 'intermediate': '中級', 'advanced': '上級', 'master': '達人級' }[currentDifficulty];
            const unlockedPacks = savedData.unlockedPacks[currentDifficulty] || 0;
            const freeCount = currentDifficulty === 'master' ? 0 : 10;
            const maxPlayable = freeCount + (unlockedPacks * 100);

            for (let i = 1; i <= maxStage; i++) {
                const stageFullName = `${diffName} ${i}`;
                const isLocked = i > maxPlayable; 
                const isCleared = savedData.cleared[stageFullName];
                const btn = document.createElement('button');
                btn.className = 'stage-btn';
                if (isLocked) { btn.classList.add('locked'); btn.innerHTML = `<span>${i}</span>`; }
                else if (isCleared) { btn.classList.add('cleared'); btn.innerHTML = `<span class="stage-num">${i}</span><span class="best-time-label">${formatTime(savedData.bestTimes[stageFullName])}</span>`; }
                else { btn.innerHTML = `<span>${i}</span>`; }
                
                btn.onclick = () => {
                    try {
                        try { playClickSound(); } catch(e){}
                        if (isLocked) { 
                            promptPurchasePack(diffName, freeCount, unlockedPacks); 
                        } else { 
                            let bData = testBoard;
                            if (currentStageList && currentStageList.length >= i && currentStageList[i - 1]) {
                                bData = currentStageList[i - 1].board || testBoard;
                            }
                            startStage(stageFullName, bData); 
                        }
                    } catch (err) {
                        alert("システムエラーを検知しました！\n詳細: " + err.message);
                    }
                };
                grid.appendChild(btn);
            }
            
            const comingSoon = document.createElement('div');
            comingSoon.style.cssText = "grid-column:1/-1; text-align:center; padding:20px 0 10px 0; color:rgba(255,255,255,0.9); font-weight:bold;";
            comingSoon.innerHTML = `🔒 ${maxStage + 1}〜 Coming Soon...<br><span style="font-size:0.85rem;font-weight:normal;">さらなる問題を現在作成中です！</span><br><br><span style="font-size:0.8rem;color:rgba(255,255,255,0.8);">※データはこのブラウザに保存されます。履歴を消去するとデータも消えます。</span>`;
            grid.appendChild(comingSoon);
        }

        function promptPurchasePack(diffName, freeCount, currentPacks) {
            const msg = "ここから先は有料ステージです。\n\n「" + diffName + " 追加100ステージパック（100円）」を購入しますか？";
            if (confirm(msg)) {
                if (STRIPE_LINKS[currentDifficulty]) {
                    window.location.href = STRIPE_LINKS[currentDifficulty];
                }
            }
        }

        function purchaseHintTicket() {
            if (confirm("「AIヒントチケット（100回分/100円）」を購入しますか？")) {
                window.location.href = STRIPE_LINKS.hint;
            }
        }

        function purchaseHintDuringGame() {
            const msg = "ヒント枠がありません。\n「AIヒントチケット（100回分/100円）」を購入しますか？\n\n※決済後、この盤面から自動的に再開されます。";
            if (confirm(msg)) {
                saveCurrentGame();
                window.location.href = STRIPE_LINKS.hint;
            }
        }

        function initMenu() { 
            updateTicketDisplay(); 
            renderStageGrid(); 
            document.getElementById('resume-container').style.display = savedData.activeGame ? 'block' : 'none';
        }

        function resumeActiveGame() {
            try { playClickSound(); } catch(e){}
            if (savedData.activeGame) {
                const active = savedData.activeGame;
                currentDifficulty = active.difficulty;
                restoreStage(active.title, active.originalBoard, active.currentBoard, active.elapsedSeconds, active.freeHints);
            }
        }

        function selectCoach(type) { try { playClickSound(); } catch(e){} currentCoach = type; document.querySelectorAll('.coach-btn').forEach(b => b.classList.remove('active')); document.getElementById(`coach-${type}`).classList.add('active'); coachImage.src = coachImages[currentCoach].normal; }
        function setCoachState(state) { stopHappyAnimation(); if(state==='happy'){ let a=true; coachImage.src=coachImages[currentCoach].happy_a; happyAnimationInterval=setInterval(()=>{a=!a;coachImage.src=a?coachImages[currentCoach].happy_a:coachImages[currentCoach].happy_b;},500); } else { coachImage.src=coachImages[currentCoach][state]; } aiCharacterArea.className = 'ai-character-area ' + state; }
        function stopHappyAnimation() { if(happyAnimationInterval){ clearInterval(happyAnimationInterval); happyAnimationInterval=null; } }

        function startStage(title, boardData) {
            if (savedData.activeGame && savedData.activeGame.title !== title) {
                if (!confirm("プレイ中の中断データがあります。新しく始めると上書きされますがよろしいですか？")) return;
            }
            try { playStartSound(); } catch(e){} 
            playSessionId++; isThinking = false; isCleared = false; selectedCell = null;
            
            let safeBoard = boardData;
            if (!safeBoard || !Array.isArray(safeBoard) || safeBoard.length !== 9) { safeBoard = testBoard; }
            
            currentOriginalBoard = JSON.parse(JSON.stringify(safeBoard)); 
            currentBoardData = JSON.parse(JSON.stringify(safeBoard));
            stageTitle.innerText = title;
            freeHintsRemaining = 3; elapsedSecondsOffset = 0;
            setupGameUI();
            saveCurrentGame();
        }

        function restoreStage(title, original, current, elapsed, freeH) {
            playSessionId++; isThinking = false; isCleared = false; selectedCell = null;
            currentOriginalBoard = original; currentBoardData = current;
            stageTitle.innerText = title;
            freeHintsRemaining = freeH; elapsedSecondsOffset = elapsed;
            setupGameUI();
        }

        function setupGameUI() {
            updateHintButtonText(); hintBtn.disabled = false; hintArea.style.display = 'none'; loadingDisplay.style.display = 'none'; clearModal.style.display = 'none';
            setCoachState('normal'); createBoardUI(); checkBoardErrors(); startTimer();
            menuScreen.style.display = 'none'; gameScreen.style.display = 'flex';
        }

        function backToMenu() { 
            try { playClickSound(); } catch(e){} 
            if (!isCleared) saveCurrentGame();
            stopTimer(); stopHappyAnimation(); playSessionId++; isThinking = false; 
            gameScreen.style.display = 'none'; menuScreen.style.display = 'flex'; 
            initMenu(); 
        }

        function startTimer() {
            stopTimer(); startTime = Date.now();
            timerInterval = setInterval(() => { timerDisplay.innerText = formatTime(elapsedSecondsOffset + Math.floor((Date.now() - startTime) / 1000)); }, 1000);
        }
        function stopTimer() { if (timerInterval) clearInterval(timerInterval); }

        function createBoardUI() {
            table.innerHTML = ""; 
            for (let r=0; r<9; r++) {
                const tr = document.createElement('tr');
                for (let c=0; c<9; c++) {
                    const td = document.createElement('td'); td.id = `cell-${r}-${c}`;
                    if (currentOriginalBoard[r][c] !== 0) { td.innerText = currentOriginalBoard[r][c]; td.classList.add('fixed'); } 
                    else { if(currentBoardData[r][c] !== 0) td.innerText = currentBoardData[r][c]; td.addEventListener('click', () => selectCell(r, c)); }
                    tr.appendChild(td);
                }
                table.appendChild(tr);
            }
        }

        function selectCell(r, c) { if (isCleared || currentOriginalBoard[r][c] !== 0 || isThinking) return; try { playClickSound(); } catch(e){} document.querySelectorAll('.selected').forEach(c => c.classList.remove('selected')); document.querySelectorAll('.highlight').forEach(c => c.classList.remove('highlight')); selectedCell = { r, c }; document.getElementById(`cell-${r}-${c}`).classList.add('selected'); }

        function inputNumber(num) {
            if (isCleared || !selectedCell || isThinking) return;
            const r = selectedCell.r, c = selectedCell.c; currentBoardData[r][c] = num;
            document.getElementById(`cell-${r}-${c}`).innerText = num === 0 ? '' : num;
            checkBoardErrors() ? playErrorSound() : playClickSound(); 
            saveCurrentGame();
            checkClear();
        }

        function checkBoardErrors() {
            document.querySelectorAll('.cell, td').forEach(c => c.classList.remove('error')); let hasErr = false;
            for (let r=0; r<9; r++) {
                for (let c=0; c<9; c++) {
                    const v = currentBoardData[r][c]; if (v === 0) continue; let err = false;
                    for (let i=0; i<9; i++) { if ((i!==c && currentBoardData[r][i]===v) || (i!==r && currentBoardData[i][c]===v)) err = true; }
                    const br = Math.floor(r/3)*3, bc = Math.floor(c/3)*3;
                    for (let i=0; i<3; i++) { for (let j=0; j<3; j++) { if ((br+i!==r || bc+j!==c) && currentBoardData[br+i][bc+j]===v) err = true; } }
                    if (err) { document.getElementById(`cell-${r}-${c}`).classList.add('error'); hasErr = true; }
                }
            }
            return hasErr;
        }

        function checkClear() {
            let isFull = true; for(let r=0;r<9;r++) for(let c=0;c<9;c++) if(currentBoardData[r][c]===0) isFull=false;
            if (isFull && document.querySelectorAll('.error').length === 0 && !isCleared) {
                isCleared = true; stopTimer(); document.querySelectorAll('.selected').forEach(c => c.classList.remove('selected')); selectedCell = null;
                clearCurrentGame();
                setCoachState('happy'); playClearSound();
                const title = stageTitle.innerText, tSec = elapsedSecondsOffset + Math.floor((Date.now() - startTime) / 1000);
                savedData.cleared[title] = true; if (!savedData.bestTimes[title] || tSec < savedData.bestTimes[title]) savedData.bestTimes[title] = tSec;
                saveGameData(); setTimeout(() => { document.getElementById('final-time').innerText = timerDisplay.innerText; clearModal.style.display = 'flex'; }, 1000); 
            }
        }
        function closeClearModal() { try { playClickSound(); } catch(e){} clearModal.style.display = 'none'; backToMenu(); }

        function updateHintButtonText() {
            hintBtn.classList.remove('upsell-mode');
            if (freeHintsRemaining > 0) { hintBtn.innerText = `AIに聞く (無料枠: ${freeHintsRemaining}回)`; } 
            else if (savedData.hintTickets > 0) { hintBtn.innerText = `AIに聞く (チケット消費 残:${savedData.hintTickets})`; } 
            else { hintBtn.innerText = "💎 ヒントチケットを購入する"; hintBtn.classList.add('upsell-mode'); }
        }

        async function getHint() {
            if (isThinking) return; try { playClickSound(); } catch(e){}
            
            if (document.querySelectorAll('.error').length > 0) {
                hintArea.innerText = "コーチのヒント：\nおや？盤面にルール違反（赤くなっているマス）があるようです！\nまずはそこを修正してから聞いてくださいね。";
                hintArea.style.display = 'block';
                return;
            }

            if (freeHintsRemaining <= 0 && (!savedData.hintTickets || savedData.hintTickets <= 0)) {
                purchaseHintDuringGame(); return; 
            }

            isThinking = true; const currentSession = playSessionId; 
            hintBtn.disabled = true; hintBtn.innerText = "思考中..."; loadingDisplay.style.display = 'block'; hintArea.style.display = 'none'; document.querySelectorAll('.highlight').forEach(c => c.classList.remove('highlight')); setCoachState('thinking');

            try {
                const res = await fetch(GAS_WEB_APP_URL, { method: 'POST', body: JSON.stringify({ originalBoard: currentOriginalBoard, currentBoard: currentBoardData }) });
                if (currentSession !== playSessionId) return;
                if (!res.ok) throw new Error('通信エラーが発生しました。');
                const result = await res.json();
                if (currentSession !== playSessionId) return; 

                if (result.success && result.hint) {
                    playHintReadySound(); // ピコーンと鳴らす
                    
                    if (freeHintsRemaining > 0) { freeHintsRemaining--; } 
                    else { savedData.hintTickets--; saveGameData(); updateTicketDisplay(); }
                    
                    const r = parseInt(result.hint.target_row) - 1, c = parseInt(result.hint.target_col) - 1;
                    hintArea.innerText = `コーチのヒント：\n${result.hint.explanation}`; hintArea.style.display = 'block';
                    document.getElementById(`cell-${r}-${c}`).classList.add('highlight'); selectCell(r, c);
                    saveCurrentGame();
                } else {
                    hintArea.innerText = `ヒントを取得できませんでした: ${result.error?.message || '不明なエラー'}`; hintArea.style.display = 'block';
                }
            } catch (error) {
                if (currentSession !== playSessionId) return; hintArea.innerText = `エラー: ${error.message}`; hintArea.style.display = 'block';
            } finally {
                if (currentSession === playSessionId) {
                    isThinking = false; loadingDisplay.style.display = 'none'; hintBtn.disabled = false; setCoachState('normal'); updateHintButtonText();
                }
            }
        }

        hintBtn.addEventListener('click', getHint);

        // 引継ぎ機能の処理
        function openTransferModal() {
            try { playClickSound(); } catch(e){}
            const safeString = btoa(encodeURIComponent(JSON.stringify(savedData)));
            document.getElementById('export-code').value = safeString;
            document.getElementById('transfer-modal').style.display = 'flex';
        }

        function copyTransferCode() {
            const copyText = document.getElementById('export-code');
            copyText.select();
            document.execCommand("copy");
            alert("引継ぎコードをコピーしました！");
        }

        function importTransferCode() {
            const importText = document.getElementById('import-code').value.trim();
            if (!importText) return;
            if (confirm("現在のデータは上書きされます。復元してもよろしいですか？")) {
                try {
                    const decodedData = JSON.parse(decodeURIComponent(atob(importText)));
                    if (decodedData && typeof decodedData === 'object') {
                        savedData = decodedData;
                        saveGameData();
                        alert("データの復元に成功しました！");
                        location.reload();
                    } else {
                        throw new Error("不正なデータです");
                    }
                } catch (e) {
                    alert("コードが間違っているか、データが壊れています。");
                }
            }
        }
    </script>
</body>
</html>
